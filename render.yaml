services:
  - type: web
    name: datapilot-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate && python backend/manage.py collectstatic --noinput
    startCommand: gunicorn --chdir backend core.wsgi:application
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: datapilot-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://your-vercel-app.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:3000,https://your-vercel-app.vercel.app"

databases:
  - name: datapilot-db
    plan: free
